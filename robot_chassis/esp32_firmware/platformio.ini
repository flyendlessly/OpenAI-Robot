; PlatformIO Project Configuration File for ESP32-S3 (N16R8)
;
; 特别针对 N16R8 (16MB Flash, 8MB Octal PSRAM) 优化

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; 串口波特率与上传速度
monitor_speed = 115200
upload_speed = 921600

; N16R8 硬件配置 (16MB Flash + OPI PSRAM)
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi

; 编译宏定义：启用 USB 虚拟串口 (CDC-ACM)，保证插在原生 USB 口上时 Serial.print 正常工作
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D BOARD_HAS_PSRAM

; 自动下载依赖库
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
